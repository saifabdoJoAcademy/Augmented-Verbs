<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>الأفعال المزيدة</title>

    <meta name="description" content="">

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      html, body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;
        background: #000;

        position: fixed;

        overscroll-behavior: none;

        /* iPhone safe-area support */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);

        box-sizing: border-box;
      }

      #unity-container {
        /*
         * Almost fullscreen while still leaving
         * a small amount of space around the game.
         */
        width: 98vw;
        height: 94dvh;

        position: fixed;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        max-width: 100vw;
        max-height: 100dvh;

        box-sizing: border-box;
      }

      #unity-canvas-container {
        width: 100%;
        height: 100%;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;

        display: block;

        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;

        touch-action: none;
      }

      /*
       * Center the Unity logo and loading bar together.
       */
      #unity-loading-bar {
        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        display: flex;
        flex-direction: column;
        align-items: center;

        width: min(80%, 400px);
      }

      #unity-logo {
        margin-bottom: 15px;
      }

      #unity-progress-bar-empty {
        width: 100%;

        background: #1B448933;
        border: 1px solid #1B4489;

        box-sizing: border-box;
      }

      #unity-progress-bar-full {
        background: #1B4489;
      }

      #unity-footer {
        position: fixed;

        bottom: env(safe-area-inset-bottom);
        right: env(safe-area-inset-right);

        z-index: 10;
      }

      #unity-container,
      #unity-canvas-container {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;

        touch-action: none;
      }
    </style>
  </head>

  <body>

    <div id="unity-container">

      <div id="unity-canvas-container">
        <canvas id="unity-canvas"></canvas>
      </div>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>

        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
      </div>

    </div>

    <script>

      var buildUrl = "Build";

      var loaderUrl =
        buildUrl + "/Augmented Verbs Github Pages.loader.js";

      var config = {
        dataUrl:
          buildUrl + "/Augmented Verbs Github Pages.data",

        frameworkUrl:
          buildUrl + "/Augmented Verbs Github Pages.framework.js",

        codeUrl:
          buildUrl + "/Augmented Verbs Github Pages.wasm",



        streamingAssetsUrl: "StreamingAssets",

        companyName: "Jo Academy",

        productName: "Augmented verbs",

        productVersion: "1.0.0",
      };


      var container =
        document.querySelector("#unity-container");

      var canvas =
        document.querySelector("#unity-canvas");

      var canvasContainer =
        document.querySelector("#unity-canvas-container");

      var loadingBar =
        document.querySelector("#unity-loading-bar");

      var progressBarFull =
        document.querySelector("#unity-progress-bar-full");

      var fullscreenButton =
        document.querySelector("#unity-fullscreen-button");

      var unityInstance = null;




      loadingBar.style.display = "block";


      /*
       * Load Unity WebGL
       */
      var script =
        document.createElement("script");

      script.src = loaderUrl;


      script.onload = () => {

        createUnityInstance(

          canvas,

          config,

          (progress) => {

            progressBarFull.style.width =
              100 * progress + "%";

          }

        ).then((instance) => {

          unityInstance = instance;

          loadingBar.style.display = "none";


          /*
           * Fullscreen button
           */
          if (fullscreenButton) {

            fullscreenButton.onclick = () => {

              unityInstance.SetFullscreen(1);

            };

          }

        }).catch((message) => {

          alert(message);

        });

      };


      document.body.appendChild(script);

    </script>

  </body>
</html>
